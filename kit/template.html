/* VOICE: a relaxed beach-town guide from a friend who knows every spot.
   IDEA: a 70s surf-shop postcard rack: sunset sign up top, postcards below.
   PICTURE: the drawn sunset over moving waves, then postcard event cards.
   COLOUR and TYPE: Intracoastal blue-green and sunset orange on white; ocean at night in dark mode. Shrikhand for signs, Nunito for reading.
   LAYOUT: hero sign, picks rail, sticky filters, day-by-day postcards, bottom tab bar like an app. */
:root{color-scheme:light dark;

*{box-sizing:border-box;min-width:0}

a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;overflow:hidden;color:#fff;padding-top:env(safe-area-inset-top,0px);isolation:isolate}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .wrap{padding-block:18px 96px;display:grid;gap:6px}

.sun{fill:light-dark(#ff6a13,#f3ecd6)}.sea1{fill:light-dark(#0b6b70,#0e4b56)}.sea2{fill:light-dark(#0e8a8f,#13606b)}.sea3{fill:light-dark(#5cc4c0,#1a7480)}
.hello{margin-top:-28px;position:relative;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line)}

.heart svg{width:24px;height:24px}.heart[aria-pressed=true]{color:var(--orange)}.heart[aria-pressed=true] path{fill:currentColor}
.more{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.pc.open .more{display:block}
.more p{margin:0 0 8px;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px}

.src{font-size:12px;color:var(--muted);margin-top:8px}

.mon{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:16px}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}

.move{background:linear-gradient(135deg,#0b6b70,#0e8a8f);color:#fff;border:0}
.move h3{color:#fff}.move a{color:#fff;font-weight:800}

.vhead{padding-top:20px}.vhead h2{margin:4px 0 6px}
.back{background:none;border:0;padding:14px 0 0;font-weight:800;color:var(--teal-d);min-height:44px}

</style>

 el.innerHTML=`<div class="install"><div><b>Keep it on your home screen.</b> ${ios?"In Safari, tap Share, then Add to Home Screen.":"Tap Install and it opens like an app."} It updates on its own.</div>${window.__bip?`<button class="btn" id="instb">Install</button>`:""}<button class="act" id="instx">Got it</button></div>`}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__bip=e;installBox()});
const VIEWS={events:evView,calendar:calView,music:musicView,plans:plansView,more:moreView,venues:venuesView};
function render(){const h=decodeURIComponent(location.hash.slice(1))||"events";let v=h,html;
 if(h.startsWith("venue-")){html=venueView(h.slice(6));v=VEN[h.slice(6)]?"more":"events"}
 else if(h.startsWith("section-")){html=secView(h.slice(8));v="more"}
 else if(h.startsWith("e-")&&BYID[h.slice(2)]){const e=BYID[h.slice(2)],d=e.date<TODAY?TODAY:e.date;S.open.add(e.id+d);S.flags.clear();S.cities.clear();S.q="";S.openDays.add(d);
  if(sec(e)!=="main"){html=secView(sec(e));v="more"}else{html=evView();v="events"}pend=`c-${e.id}-${d}`}
 else if(h==="add"||h==="openings"){html=moreView();v="more";pend=h}
 else{v=VIEWS[h]?h:"events";html=VIEWS[v]()}
 cur=v;document.body.classList.toggle("sub",v!=="events");V.innerHTML=html;document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v?"page":"false"));installBox();
 if(pend){const el=document.getElementById(pend);pend=null;if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),40)}}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);render();if(!/^(e-|add$|openings$)/.test(h))window.scrollTo(0,0)});
V.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value.trim().toLowerCase();clearTimeout(window.__qt);window.__qt=setTimeout(()=>{const pos=e.target.selectionStart;rerender();const q=$("#q");if(q){q.focus({preventScroll:true});try{q.setSelectionRange(pos,pos)}catch(_){}}},250)}});
V.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,fd=new FormData(f);
 if(f.id==="mailf"){const body=new FormData();body.append("fields[email]",fd.get("email"));body.append("ml-submit","1");body.append("anticsrf","true");
  try{await fetch(`https://assets.mailerlite.com/jsonp/${CFG.ml_account||"867109"}/forms/${CFG.ml_form||"205162874792838197"}/subscribe`,{method:"POST",body,mode:"no-cors"});f.innerHTML=`<p><b>Almost done.</b> Check your inbox and confirm, and the weekend picks start Thursday.</p>`;track("signup/email","Email signup")}catch(_){toast("That didn't go through. Try again in a minute.")}}
 if(f.id==="addf"){const o=Object.fromEntries(fd.entries());track("submit/event","Event submitted");const subj="Event Calendar submission: "+o.event,body=Object.entries(o).map(([k,v])=>`${k}: ${v}`).join("\n");
  if(CFG.formspree){try{const r=await fetch(CFG.formspree,{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:JSON.stringify({...o,_subject:subj})});if(!r.ok)throw 0;f.innerHTML=`<p><b>Got it, thank you.</b> Justin and Jacque will take a look and add it.</p>`}catch(_){toast("That didn't send. Try again in a minute.")}}
  else{location.href=CFG.contact_email?`mailto:${CFG.contact_email}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`:`sms:${PHONE_TEL}?&body=${encodeURIComponent(subj+"\n"+body)}`;if(!f.querySelector(".fine"))f.insertAdjacentHTML("beforeend",`<p class="fine">Your ${CFG.contact_email?"email":"messages"} app should open with everything filled in. Just hit send. If it didn't, text the details to ${PHONE}.</p>`)}}});
document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;const ds=t.dataset;
 if(ds.flag){const k=ds.flag;S.flags.has(k)?S.flags.delete(k):S.flags.add(k);if(k==="kids"&&!S.flags.has("kids"))S.ages.clear();rerender();return}
 if(ds.city){const k=ds.city;S.cities.has(k)?S.cities.delete(k):S.cities.add(k);rerender();return}
 if(ds.age){const k=ds.age;S.ages.has(k)?S.ages.delete(k):S.ages.add(k);rerender();return}
 if(ds.open){const[id,d]=ds.open.split("|"),k=id+d,el=document.getElementById(`c-${id}-${d}`);S.open.has(k)?S.open.delete(k):S.open.add(k);if(el){el.classList.toggle("open",S.open.has(k));t.setAttribute("aria-expanded",S.open.has(k))}return}
 if(ds.save){const id=ds.save,ev=BYID[id];if(SAVED.has(id)){SAVED.delete(id);toast("Removed. More time for the beach.")}else{SAVED.add(id);toast("Saved. See you there.");track("save/"+id,ev?ev.title:id)}ls.set("ec-saved",[...SAVED]);document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{b.setAttribute("aria-pressed",SAVED.has(id));b.setAttribute("aria-label",(SAVED.has(id)?"Remove from":"Save to")+" My Plans")});if(cur==="plans")rerender();return}
 if(ds.share){const[id,d]=ds.share.split("|");share(facts(BYID[id],d));track("share/"+id,BYID[id].title);return}
 if(ds.sharev){const v=VEN[ds.sharev];share(`${v.name}: upcoming events\n${DATA.share_url}#venue-${v.slug}`);return}
 if(ds.follow){const s=ds.follow;if(FOLLOW.has(s)){FOLLOW.delete(s);toast("Unfollowed.")}else{FOLLOW.add(s);toast("Following. Find it in My Plans.");track("follow/"+s,VEN[s]&&VEN[s].name)}ls.set("ec-follow",[...FOLLOW]);rerender();return}
 if(ds.day){S.openDays.add(ds.day);rerender();return}
 if(ds.jump){const el=document.getElementById("d-"+ds.jump);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});else toast("Nothing matches on that day.");return}
 if(ds.cal){S.calDay=ds.cal;rerender();const el=document.getElementById("d-"+S.calDay);if(el)el.scrollIntoView({behavior:"smooth"});return}
 if(t.hasAttribute("data-back")){history.length>1?history.back():(location.hash="more");return}
 if(t.id==="shareapp"){share(`Every event in Boca, Delray and Boynton, in one app:\n${DATA.share_url}`);return}
 if(t.id==="instx"){ls.set("ec-inst",1);$("#install").innerHTML="";return}
 if(t.id==="instb"&&window.__bip){window.__bip.prompt();window.__bip=null;$("#install").innerHTML="";return}
 if(t.id==="pushb"&&window.OneSignalDeferred){window.OneSignalDeferred.push(async os=>{try{await os.Notifications.requestPermission()}catch(_){}});return}});
{const ids=new Set(MAIN.map(r=>r.id)),E=[...ids].map(i=>BYID[i]);$("#stats").textContent=`${ids.size.toLocaleString()} events · ${E.filter(e=>free(e.price)).length} free · ${E.filter(e=>tags(e).includes("kids")).length} for kids · ${E.filter(e=>e.category==="Music").length} shows`}
(async()=>{try{const c=ls.get("ec-wx",null);if(c&&Date.now()-c.t<3*3600e3){Object.assign(W,c.w);rerender();return}
 const p=await (await fetch("https://api.weather.gov/points/26.4615,-80.0728")).json();const f=await (await fetch(p.properties.forecast)).json();
 for(const x of f.properties.periods){const d=x.startTime.slice(0,10);W[d]=W[d]||{};const pop=x.probabilityOfPrecipitation?x.probabilityOfPrecipitation.value:null;if(x.isDaytime){W[d].hi=x.temperature;W[d].pop=pop}else{W[d].lo=x.temperature;if(W[d].pop==null)W[d].pop=pop}}
 ls.set("ec-wx",{t:Date.now(),w:W});rerender()}catch(_){}})();
const real=window.self===window.top&&location.protocol==="https:";
if(real&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(real&&CFG.goatcounter){const s=document.createElement("script");s.async=true;s.src="https://gc.zgo.at/count.js";s.dataset.goatcounter=`https://${CFG.goatcounter}.goatcounter.com/count`;document.head.append(s)}
if(real&&CFG.onesignal){window.OneSignalDeferred=window.OneSignalDeferred||[];const s=document.createElement("script");s.defer=true;s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";document.head.append(s);window.OneSignalDeferred.push(async os=>{await os.init({appId:CFG.onesignal})})}
render();
}
</script>
